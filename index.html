<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>렉 QR 스캔</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root { --bg:#000; --fg:#fff; --accent:#534AB7; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--fg); font-family:sans-serif; overflow:hidden; }
#v { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
#box { position:fixed; left:50%; top:42%; width:70vmin; height:70vmin; transform:translate(-50%,-50%);
       border:3px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 0 0 100vmax rgba(0,0,0,.3); }
#box.ok { border-color:#3ad07a; }
#top { position:fixed; left:0; right:0; top:0; padding:calc(12px + env(safe-area-inset-top)) 16px 10px; text-align:center;
       font-size:17px; font-weight:bold; background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0)); }
#msg { position:fixed; left:16px; right:16px; top:calc(42% + 38vmin); text-align:center; font-size:16px; line-height:1.5; }
#info { position:fixed; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom)); text-align:center; font-size:11px; color:rgba(255,255,255,.55); }
#bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 12px calc(14px + env(safe-area-inset-bottom));
       background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75)); }
#bar button { flex:1; font-size:16px; padding:14px 6px; border:0; border-radius:10px; background:#fff; color:#222; }
#bar button.main { background:var(--accent); color:#fff; }
#torch, #zoom { display:none; }
</style>
</head><body>
<video id="v" playsinline muted autoplay></video>
<div id="box"></div>
<div id="top">옮길 렉 QR 을 네모 안에 비추세요</div>
<div id="msg">카메라 켜는 중...</div>
<div id="info"></div>
<div id="bar">
  <button id="zoom" type="button">🔍 확대</button>
  <button id="torch" type="button">🔦 불</button>
  <button id="back" type="button" class="main">직접 입력으로</button>
</div>
<script>
/* 벌크 재고이동 — 렉 QR 스캔 화면 (https://ohlog-wms.github.io/qr/)
   구글 웹앱 화면 안에서는 카메라가 막혀서, 스캔만 이 화면에서 하고
   읽으면 재고이동 화면(웹앱)으로 ?loc=렉번호 를 붙여 돌아간다.
   ★2026-11-24 첫 배포에서 "네모에 넣어도 인식 못함" → 고침:
     · 카메라 해상도를 높게(1920x1080) 받고, 잘라 읽을 때 줄이지 않는다 (2cm QR 은 작아서 줄이면 못 읽음)
     · 크롬 내장 인식기(BarcodeDetector)와 jsQR 을 번갈아 쓴다 (기종마다 한쪽이 약함)
     · jsQR 은 네모 가운데를 작게·중간·크게 번갈아 잘라 본다 (QR 여러 개가 같이 보이면 jsQR 이 헷갈림)
     · 핸드폰이 지원하면 2배 확대를 기본으로 켠다 (가까이 안 대도 QR 이 크게 잡힘), 연속 초점 요청 */
var APP = "https://script.google.com/macros/s/AKfycbxp_Qs4CUokGnKk6hwmVRHqYh_n8nTZ6FcXnqhbDQ-YOUsd-TuyLwjxVfeIaMOZIImE/exec";
var v = document.getElementById("v"), msg = document.getElementById("msg"), box = document.getElementById("box"), info = document.getElementById("info");
var stream = null, det = null, cv = document.createElement("canvas"), done = false, track = null;
var torchOn = false, zoomCap = null, zoomOn = false, frame = 0, engineNote = "";
try { if (window.BarcodeDetector) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { det = null; }

function parseLoc(txt) {
  txt = String(txt || "").trim();
  var m = /[?&]loc=([^&#]+)/.exec(txt);
  var s = (m ? decodeURIComponent(m[1]) : txt).toUpperCase().trim();
  return /^[A-Z0-9]{2}-[A-Z0-9]{2}-[0-9]{2}-[0-9]{2}$/.test(s) ? s : "";
}
function go(loc) {
  if (done) return; done = true;
  box.className = "ok"; msg.textContent = loc ? "읽었습니다: " + loc : "돌아갑니다...";
  if (loc && navigator.vibrate) navigator.vibrate(80);
  try { stream && stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
  location.replace(APP + (loc ? "?loc=" + encodeURIComponent(loc) : ""));
}
document.getElementById("back").onclick = function () { go(""); };

var notRack = 0;
function seen(raw) {   /* 읽긴 했는데 렉 QR 이 아닌 경우 안내 */
  notRack++; if (notRack > 2) msg.textContent = "렉 QR 이 아닙니다 — 렉에 붙은 QR 을 비추세요";
}
/* 네모(화면 위쪽 42%) 에 가장 가까운 렉 QR */
function pickCenter(list, W, H) {
  var best = "", bd = 1e18;
  for (var i = 0; i < list.length; i++) {
    var s = parseLoc(list[i].rawValue);
    if (!s) { seen(list[i].rawValue); continue; }
    var b = list[i].boundingBox || { x: W / 2, y: H / 2, width: 0, height: 0 };
    var dx = b.x + b.width / 2 - W / 2, dy = b.y + b.height / 2 - H * 0.42, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
/* jsQR — 네모 가운데를 작게·중간·크게 번갈아 잘라 읽는다.
   (jsQR 은 한 장에 QR 이 여러 개 있으면 헷갈려 못 읽는다 → 작게 자르면 가운데 QR 하나만 남는다)
   해상도는 1100px 까지 줄이지 않는다 */
var CROPS = [0.42, 0.6, 0.8];
function jsRead(n) {
  if (!window.jsQR) return "";
  var W = v.videoWidth, H = v.videoHeight; if (!W || !H) return "";
  var side = Math.min(W, H) * CROPS[n % CROPS.length];
  var sx = (W - side) / 2, sy = Math.max(0, Math.min(H - side, H * 0.42 - side / 2)), sw = side, sh = side;
  var k = Math.min(1, 1100 / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k);
  cv.width = w; cv.height = h;
  var g = cv.getContext("2d", { willReadFrequently: true });
  g.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
  var c = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "attemptBoth" });
  if (!c) return "";
  var s = parseLoc(c.data); if (!s) seen(c.data);
  return s;
}
function tick() {
  if (done || !stream) return;
  if (v.readyState < 2) { setTimeout(tick, 120); return; }
  frame++;
  var useDet = det && (frame % 2 === 1);        // 홀수 = 크롬 인식기, 짝수 = jsQR
  var p = useDet
    ? det.detect(v).then(function (l) { return pickCenter(l, v.videoWidth, v.videoHeight); })
    : Promise.resolve(jsRead(det ? frame >> 1 : frame));
  p.then(function (s) {
    if (frame % 10 === 0) info.textContent = engineNote + " · " + v.videoWidth + "x" + v.videoHeight + " · " + frame;
    if (s) go(s); else setTimeout(tick, 60);
  }).catch(function () { det = null; engineNote = "jsQR"; setTimeout(tick, 100); });
}
function setZoom(on) {
  if (!zoomCap || !track) return;
  zoomOn = on;
  var z = on ? Math.min(2, zoomCap.max) : Math.max(1, zoomCap.min);
  track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {});
  document.getElementById("zoom").textContent = on ? "🔍 확대 끄기" : "🔍 2배 확대";
}
function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = "이 브라우저에서는 카메라를 쓸 수 없습니다. 크롬으로 열어 주세요."; return;
  }
  navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 },
      advanced: [{ focusMode: "continuous" }] } })
    .then(function (s) {
      stream = s; v.srcObject = s; var pl = v.play(); if (pl && pl.catch) pl.catch(function () {});
      msg.textContent = "QR 을 네모 가득 차게 — 흐리면 조금 떨어뜨리세요";
      engineNote = det ? "크롬인식기+jsQR" : "jsQR";
      track = s.getVideoTracks()[0];
      try {
        var cap = track.getCapabilities ? track.getCapabilities() : {};
        if (cap.focusMode && cap.focusMode.indexOf("continuous") >= 0) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function () {});
        if (cap.zoom && cap.zoom.max >= 1.5) {
          zoomCap = cap.zoom; var zb = document.getElementById("zoom"); zb.style.display = "block";
          zb.onclick = function () { setZoom(!zoomOn); };
          setZoom(true);
        }
        if (cap.torch) {
          var tb = document.getElementById("torch"); tb.style.display = "block";
          tb.onclick = function () {
            torchOn = !torchOn;
            track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
            tb.textContent = torchOn ? "🔦 끄기" : "🔦 불";
          };
        }
      } catch (e) {}
      tick();
    })
    .catch(function (e) {
      var n = e && e.name || "";
      msg.textContent = n === "NotAllowedError"
        ? "카메라 허용이 꺼져 있습니다. 주소창 왼쪽 아이콘 → 권한 → 카메라 '허용' 으로 바꾼 뒤 다시 열어 주세요."
        : "카메라를 켤 수 없습니다 (" + n + "). 다른 앱이 카메라를 쓰고 있으면 닫고 다시 열어 주세요.";
    });
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden && stream && !done) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  else if (!document.hidden && !stream && !done) start();
});
start();
</script>
</body></html>
